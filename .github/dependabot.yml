# Opens a pull request when a dependency has a new version. Nothing is merged
# automatically: each pull request goes through CI and waits for a review.
version: 2
updates:
  # The actions in .github/workflows, pinned to commit SHAs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The crates in Cargo.toml and Cargo.lock.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
