# The directory is called `core`, but the package cannot be: `core` is the name
# of Rust's built-in library and the two names would clash.
[package]
name = "thumbring-core"
version.workspace = true
description = "Pure logic of the action ring and the mouse gestures, with no Windows dependency."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
toml.workspace = true
